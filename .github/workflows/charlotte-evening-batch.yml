name: Charlotte routing batch

on:
  schedule:
    # 05:17 IST = 23:47 UTC on the previous day
    # Morning sweep
    - cron: "47 23 * * *"

    # 17:17 IST = 11:47 UTC
    # Evening sweep
    - cron: "47 11 * * *"

  # Allows you to run Charlotte manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charlotte-routing-batch
  cancel-in-progress: false

jobs:
  route-captures:
    runs-on: ubuntu-latest
    environment: charlotte-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify routing and index code
        run: python -m pytest tests -q

      - name: Refresh vault index
        run: python scripts/charlotte_index.py .

      - name: Import Telegram captures and create proposals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_routing_batch.py --vault .

      - name: Commit generated vault changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vault-index.json "01 Daily Logs"

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: run Charlotte routing batch"

          # Incorporate anything pushed to main while Charlotte was running
          git pull --rebase origin main

          git push origin HEAD:main
