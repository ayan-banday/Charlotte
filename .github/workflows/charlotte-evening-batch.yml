name: Charlotte evening batch

on:
  schedule:
    # 17:30 Asia/Kolkata is 10:00 UTC year-round.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charlotte-evening-batch
  cancel-in-progress: false

jobs:
  route-captures:
    runs-on: ubuntu-latest
    environment: charlotte-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Verify routing and index code
        run: python -m pytest tests -q
      - name: Refresh vault index
        run: python scripts/charlotte_index.py .
      - name: Import Telegram captures and create proposals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_routing_batch.py --vault .
      - name: Commit generated vault changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vault-index.json "01 Daily Logs"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: run Charlotte evening batch"
          git pull --rebase origin main
          git push origin HEAD:main
