name: Bootstrap Charlotte Telegram capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: charlotte-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate bot and initialise update cursor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/bootstrap_telegram_capture.py --vault .
      - name: Commit capture cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "01 Daily Logs/.telegram-capture-state.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: initialise Telegram capture cursor"
          git push origin HEAD:main
